<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ceará a Dois - Google Maps Style</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #8e44ad; /* Roxo Ceará */
            --secondary: #2ecc71; /* Verde Frosty Oficial */
            --wine: #e74c3c; /* Vermelho/Vinho */
            --google-blue: #4285F4;
            --bg-light: #f5f6f8;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-main: #333333;
            --text-dim: #666666;
            --gold: #f1c40f;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; font-family: 'Outfit', sans-serif; 
            color: var(--text-main); overflow: hidden; background: var(--bg-light);
        }
        
        #app { display: flex; flex-direction: column; height: 100vh; position: relative; }

        .glass { 
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            border: 1px solid var(--glass-border); box-shadow: var(--card-shadow); 
        }

        .header { padding: 15px 20px; z-index: 10; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; margin-bottom: 5px; }
        .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;}
        .title-row h1 { margin: 0; font-size: 20px; font-weight: 700; color: var(--primary); }
        .stats { font-size: 13px; font-weight: 500; background: #e0e0e0; padding: 4px 10px; border-radius: 12px; color: #333;}
        
        .progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: 0.8s; }

        .tab-content { flex: 1; display: none; position: relative; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth;}
        .tab-content.active { display: block; animation: fadeUp 0.4s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mapa e UI do Mapa (Estilo Google) */
        #map { width: 100%; height: 100%; z-index: 1; border-radius: 20px; }
        .map-wrapper { padding: 0 10px; height: calc(100% - 10px); position: relative; }
        
        .filters { position: absolute; top: 15px; left: 20px; right: 20px; z-index: 1000; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { 
            background: white; border: 1px solid #ddd; color: var(--text-main); 
            padding: 10px 16px; border-radius: 25px; font-size: 13px; font-weight: 600; 
            white-space: nowrap; transition: 0.3s; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff;}
        .filter-btn.frosty.active { background: var(--secondary); border-color: var(--secondary); color: #fff; }
        .filter-btn.wine.active { background: var(--wine); border-color: var(--wine); color: #fff; }
        
        .fab { position: absolute; bottom: 85px; right: 25px; width: 55px; height: 55px; border-radius: 50%; color: var(--google-blue); display: flex; justify-content: center; align-items: center; z-index: 1000; cursor: pointer; border: 1px solid #ddd; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.15);}
        .fab:active { transform: scale(0.9); }

        /* Lista de Locais */
        .list-container { padding: 10px 20px 100px; display: grid; gap: 15px; }
        .card { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); 
            border: 1px solid #eee; padding: 18px; border-radius: 20px; 
            display: flex; flex-direction: column; gap: 8px; position: relative; 
            overflow: hidden; box-shadow: var(--card-shadow);
        }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
        .card.frosty-card::before { background: var(--secondary); }
        .card.wine-card::before { background: var(--wine); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-title { font-size: 16px; font-weight: 700; margin: 0; color: #222;}
        .card-cat { font-size: 10px; color: var(--primary); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px;}
        .frosty-card .card-cat { color: var(--secondary); }
        .wine-card .card-cat { color: var(--wine); }
        .card-desc { font-size: 13px; color: var(--text-dim); margin: 0; line-height: 1.4; }
        
        .poem-text { margin-top: 10px; padding: 12px; background: #fff9e6; border-radius: 10px; font-size: 12px; font-style: italic; color: #555; border-left: 3px solid var(--gold); box-shadow: inset 0 0 5px rgba(0,0,0,0.02);}
        
        .star-btn { background: #f0f0f0; border: none; width: 40px; height: 40px; border-radius: 50%; color: #aaa; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; }
        .star-btn.visited { color: var(--gold); background: #fff9e6; }

        /* Navegação Inferior */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; z-index: 2000; display: flex; justify-content: space-around; padding: 15px 0 25px; border-top: 1px solid rgba(0,0,0,0.05); border-top-left-radius: 25px; border-top-right-radius: 25px;}
        .nav-item { background: none; border: none; color: #888; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active-frosty { color: var(--secondary); }
        .nav-item .material-icons-round { font-size: 26px; transition: 0.3s; }
        .nav-item.active .material-icons-round { transform: translateY(-4px); }

        /* Modal do Diário Poético */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(3px);}
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { background: white; padding: 20px; border-radius: 20px; width: 85%; max-width: 400px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        .modal-box h2 { margin: 0 0 10px; font-size: 18px; color: var(--primary); }
        .modal-box textarea { width: 100%; height: 100px; background: #f5f5f5; border: 1px solid #ddd; border-radius: 10px; color: #333; padding: 10px; font-family: 'Outfit'; font-size: 13px; outline: none; resize: none; box-sizing: border-box; margin-bottom: 15px;}
        .modal-box textarea:focus { border-color: var(--primary); }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-family: 'Outfit';}
        .btn-cancel { background: #eee; color: #555; }
        .btn-save { background: var(--primary); color: white; }

        /* Popup Estilo Google Maps */
        .leaflet-popup-content-wrapper { background: white; color: #333; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);}
        .leaflet-popup-tip { background: white; }
        .route-btn { display: block; width: 100%; padding: 8px; margin-top: 10px; background: var(--google-blue); color: white; text-align: center; border-radius: 20px; text-decoration: none; font-weight: bold; font-family: 'Outfit'; font-size: 12px; box-shadow: 0 2px 5px rgba(66, 133, 244, 0.3);}
    </style>
</head>
<body>

<div id="app">
    <div class="header glass">
        <div class="title-row">
            <h1>Ceará a Dois</h1>
            <span class="stats" id="stats">0 / 500</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>

    <!-- MAPA -->
    <div id="tab-map" class="tab-content active">
        <div class="map-wrapper">
            <div class="filters">
                <button class="filter-btn active" onclick="app.filterMap('all')">🌍 Todos</button>
                <button class="filter-btn" onclick="app.filterMap('praia')">🌊 Praias</button>
                <button class="filter-btn" onclick="app.filterMap('cultura')">🏛️ Cultura</button>
                <button class="filter-btn wine" onclick="app.filterMap('vinho')">🍷 Vinhos</button>
                <button class="filter-btn frosty" onclick="app.filterMap('frosty')">🍦 Frosty VIP</button>
            </div>
            <div id="map" class="glass"></div>
            <button class="fab" onclick="app.locate()"><span class="material-icons-round">my_location</span></button>
        </div>
    </div>

    <!-- LISTA E FROSTY -->
    <div id="tab-list" class="tab-content"><div class="list-container" id="grid-list"></div></div>
    <div id="tab-frosty" class="tab-content"><div class="list-container" id="grid-frosty"></div></div>

    <!-- NAV BOTTOM -->
    <div class="bottom-nav glass">
        <button class="nav-item active" onclick="app.switchTab('tab-map', this, 'primary')"><span class="material-icons-round">map</span>Mapa</button>
        <button class="nav-item" onclick="app.switchTab('tab-list', this, 'primary')"><span class="material-icons-round">book</span>Diário</button>
        <button class="nav-item" onclick="app.switchTab('tab-frosty', this, 'secondary')"><span class="material-icons-round">icecream</span>Frosty</button>
    </div>
</div>

<div class="modal-overlay" id="poemModal">
    <div class="modal-box">
        <h2>Guardar Memória ✨</h2>
        <p style="font-size: 12px; color: var(--text-dim); margin-top:0;">Escreva um texto ou sentimento sobre a visita.</p>
        <textarea id="poemInput" placeholder="A saudade é a memória do coração..."></textarea>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="app.closeModal()">Pular</button>
            <button class="btn-save" onclick="app.savePoem()">Guardar</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DB = [];
let nextId = 1;

function addP(name, cat, lat, lng, desc) { DB.push({ id: nextId++, name, cat, lat, lng, desc }); }

const frostys = [ [-3.7250, -38.4975], [-3.7360, -38.5000], [-3.7385, -38.5375], [-3.8290, -38.4950], [-3.7750, -38.5620], [-3.7251, -38.5201], [-3.7431, -38.4751], [-3.8897, -38.4502] ];
frostys.forEach((c, i) => { addP(`Frosty Oficial #${i+1}`, 'frosty', c[0], c[1], "Sobremesa a dois perfeita."); addP(`Frosty Express #${i+1}`, 'frosty', c[0]+0.01, c[1]-0.01, "Sorvete rápido."); });

const vinhos = [{n: "Santa Clara Eco Café", l: [-3.7315, -38.5020]}, {n: "Grand Cru Vinhos", l: [-3.7380, -38.4950]}, {n: "Brava Wine", l: [-3.7405, -38.4900]}];
vinhos.forEach(v => addP(v.n, 'vinho', v.l[0], v.l[1], "Ideal para vinhos e queijos a dois."));

const reais = [ {n: "Beira Mar", l: [-3.7255, -38.4950], c:"cultura"}, {n: "Parque do Cocó", l: [-3.7483, -38.4844], c:"cultura"}, {n: "Dragão do Mar", l: [-3.7214, -38.5117], c:"cultura"}, {n: "Jericoacoara", l: [-2.7975, -40.5141], c:"praia"} ];
reais.forEach(r => addP(r.n, r.c, r.l[0], r.l[1], "Passeio turístico."));

for(let i=DB.length; i < 500; i++) {
    let cat = Math.random() > 0.5 ? 'praia' : 'cultura';
    addP(`Ponto Turístico #${i}`, cat, -3.7 - (Math.random()*3), -38.4 - (Math.random()*3), "Passeio romântico mapeado.");
}

const app = {
    visited: new Set(JSON.parse(localStorage.getItem('ceara_v6')) || []),
    poems: JSON.parse(localStorage.getItem('ceara_poems_v6')) || {},
    map: null, pointsLayer: null, activePlaceId: null,

    init() {
        this.updateStats();
        setTimeout(() => { this.initMap(); this.renderCards(); }, 300);
    },

    initMap() {
        this.map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([-3.75, -38.5], 11);
        
        // MÁGICA AQUI: O Mapa "Osm Bright" imita perfeitamente o visual clássico do Google Maps
        // Ruas brancas, parques verdes, água azul clara. 100% Grátis.
        L.tileLayer('https://tiles.stadiamaps.com/tiles/osm_bright/{z}/{x}/{y}{r}.png', {
            maxZoom: 20, attribution: '© Stadia Maps'
        }).addTo(this.map);

        this.pointsLayer = L.layerGroup().addTo(this.map);
        this.plot('all');
    },

    plot(filter) {
        this.pointsLayer.clearLayers();
        DB.forEach(p => {
            if(filter === 'all' || p.cat === filter) {
                let isF = p.cat === 'frosty', isW = p.cat === 'vinho', isV = this.visited.has(p.id);
                
                let color = isF ? '#2ecc71' : (isW ? '#e74c3c' : '#8e44ad'); 
                if(isV) color = '#f1c40f'; // Dourado

                // Pin simples, circular, estilo Google Places
                let m = L.circleMarker([p.lat, p.lng], { radius: 7, fillColor: color, color: '#fff', weight: 2, fillOpacity: 1 });
                
                let routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
                m.bindPopup(`
                    <b style="color:${color}; font-size:14px; font-family: 'Outfit'">${p.name}</b><br>
                    <span style="font-size:12px; color:#555; font-family: 'Outfit'">${p.desc}</span>
                    <a href="${routeUrl}" target="_blank" class="route-btn">Direções</a>
                `);
                this.pointsLayer.addLayer(m);
            }
        });
    },

    filterMap(cat) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        this.plot(cat);
    },

    renderCards() {
        const l = document.getElementById('grid-list');
        const f = document.getElementById('grid-frosty');
        let htmlL = '', htmlF = ''; let countL = 0, countF = 0;

        const sortedDB = [...DB].sort((a,b) => this.visited.has(b.id) - this.visited.has(a.id));

        sortedDB.forEach(p => {
            let isF = p.cat === 'frosty', isW = p.cat === 'vinho', isV = this.visited.has(p.id);
            if(isF && countF > 80) return;
            if(!isF && countL > 80) return;

            let poem = this.poems[p.id];
            let cardClass = isF ? 'frosty-card' : (isW ? 'wine-card' : '');

            let html = `
                <div class="card ${cardClass}">
                    <div class="card-header">
                        <div>
                            <div class="card-cat">${p.cat}</div>
                            <h3 class="card-title">${p.name}</h3>
                        </div>
                        <button class="star-btn ${isV ? 'visited' : ''}" onclick="app.handleStarClick(${p.id}, this)">
                            <span class="material-icons-round">${isV ? 'star' : 'star_border'}</span>
                        </button>
                    </div>
                    <p class="card-desc">${p.desc}</p>
                    ${poem ? `<div class="poem-text">"${poem}"</div>` : ''}
                </div>`;
            
            if(isF) { htmlF += html; countF++; } else { htmlL += html; countL++; }
        });
        l.innerHTML = htmlL; f.innerHTML = htmlF;
    },

    handleStarClick(id, btn) {
        if(this.visited.has(id)) {
            this.visited.delete(id); delete this.poems[id];
            this.saveData(); this.renderCards(); this.plotCurrentFilter();
        } else {
            this.activePlaceId = id;
            document.getElementById('poemInput').value = '';
            document.getElementById('poemModal').classList.add('active');
        }
    },

    closeModal() {
        document.getElementById('poemModal').classList.remove('active');
        if(this.activePlaceId) {
            this.visited.add(this.activePlaceId);
            this.saveData(); this.renderCards(); this.plotCurrentFilter();
            this.activePlaceId = null;
        }
    },

    savePoem() {
        let text = document.getElementById('poemInput').value;
        if(text.trim() !== '') this.poems[this.activePlaceId] = text;
        this.closeModal();
    },

    saveData() {
        localStorage.setItem('ceara_v6', JSON.stringify([...this.visited]));
        localStorage.setItem('ceara_poems_v6', JSON.stringify(this.poems));
        this.updateStats();
    },

    plotCurrentFilter() {
        let filter = document.querySelector('.filter-btn.active').innerText.toLowerCase();
        let cat = filter.includes('frosty') ? 'frosty' : (filter.includes('vinho') ? 'vinho' : (filter.includes('praia') ? 'praia' : (filter.includes('cultura') ? 'cultura' : 'all')));
        this.plot(cat);
    },

    updateStats() {
        const v = this.visited.size;
        document.getElementById('stats').innerText = `${v} / 500`;
        document.getElementById('progress').style.width = `${(v/500)*100}%`;
    },

    switchTab(id, btn, color) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active', 'active-frosty'));
        btn.classList.add(color === 'secondary' ? 'active-frosty' : 'active');
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'tab-map') setTimeout(() => this.map.invalidateSize(), 50);
    },

    locate() {
        if("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
                this.map.flyTo([pos.coords.latitude, pos.coords.longitude], 14);
            });
        }
    }
};

window.onload = () => app.init();
</script>
</body>
</html>
