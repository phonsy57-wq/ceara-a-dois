<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ceará a Dois - Liquid Glass</title>
    
    <!-- Leaflet Puro e Otimizado -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #9d4edd; /* Roxo */
            --secondary: #00f5d4; /* Verde Água */
            --glass-bg: rgba(25, 25, 35, 0.55);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-glow: rgba(157, 78, 221, 0.2);
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
            --gold: #ffd700;
        }

        /* Animação do Fundo Líquido */
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; font-family: 'Outfit', sans-serif; 
            color: var(--text-main); overflow: hidden;
            /* Fundo Gradiente Animado */
            background: linear-gradient(-45deg, #0d0a14, #1a0f2e, #0a1f1c, #0d0a14);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
        }
        
        #app { display: flex; flex-direction: column; height: 100vh; position: relative; }

        /* Utilitário Glassmorphism */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Header Dashboard */
        .header { 
            padding: 15px 20px; z-index: 10; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; 
            margin-bottom: 5px; box-shadow: 0 10px 20px var(--glass-glow);
        }
        .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;}
        .title-row h1 { 
            margin: 0; font-size: 20px; font-weight: 700; 
            background: linear-gradient(90deg, var(--primary), var(--secondary)); 
            background-clip: text; 
            -webkit-background-clip: text; 
            color: transparent; 
            -webkit-text-fill-color: transparent; 
        }
        .stats { font-size: 13px; font-weight: 500; color: var(--text-main); background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 12px;}
        
        .progress-bar { width: 100%; height: 8px; background: rgba(0,0,0,0.4); border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);}
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px var(--secondary);}

        /* Abas / Views */
        .tab-content { flex: 1; display: none; position: relative; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth;}
        .tab-content.active { display: block; animation: fadeUp 0.4s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mapa UI */
        #map { width: 100%; height: 100%; z-index: 1; background: transparent; border-radius: 20px; }
        .map-wrapper { padding: 0 10px; height: calc(100% - 10px); position: relative; }
        
        .filters { position: absolute; top: 15px; left: 20px; right: 20px; z-index: 1000; display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        
        .filter-btn { 
            background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); 
            color: var(--text-main); padding: 10px 18px; border-radius: 25px; font-size: 12px; font-weight: 500; 
            white-space: nowrap; transition: 0.3s; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .filter-btn.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 15px var(--glass-glow); }
        .filter-btn.frosty.active { background: var(--secondary); border-color: var(--secondary); color: #000; box-shadow: 0 0 15px rgba(0, 245, 212, 0.4); }
        
        .fab { 
            position: absolute; bottom: 85px; right: 25px; width: 55px; height: 55px; border-radius: 50%; 
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--secondary); 
            color: var(--secondary); display: flex; justify-content: center; align-items: center; z-index: 1000; 
            cursor: pointer; box-shadow: 0 0 20px rgba(0, 245, 212, 0.2); transition: 0.3s;
        }
        .fab:active { transform: scale(0.9); }

        /* Lista & Cards Glass */
        .list-container { padding: 10px 20px 100px; display: grid; gap: 15px; }
        
        .card { 
            background: rgba(25, 25, 35, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); 
            padding: 18px; border-radius: 20px; display: flex; flex-direction: column; gap: 8px; 
            position: relative; overflow: hidden; transition: 0.3s;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary);
        }
        .card.frosty-card::before { background: var(--secondary); }
        .card.frosty-card { background: rgba(0, 245, 212, 0.05); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-title { font-size: 16px; font-weight: 700; margin: 0; }
        .card-cat { font-size: 10px; color: var(--primary); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px;}
        .frosty-card .card-cat { color: var(--secondary); }
        .card-desc { font-size: 13px; color: var(--text-dim); margin: 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        
        .star-btn { 
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); width: 40px; height: 40px; 
            border-radius: 50%; color: var(--text-dim); display: flex; justify-content: center; align-items: center; 
            cursor: pointer; transition: 0.3s; 
        }
        .star-btn.visited { color: var(--gold); background: rgba(255, 215, 0, 0.1); border-color: rgba(255, 215, 0, 0.3); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        .star-btn:active { transform: scale(0.8); }

        /* Bottom Nav Glass */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; z-index: 2000; 
            display: flex; justify-content: space-around; padding: 15px 0 25px; 
            border-top: 1px solid rgba(255,255,255,0.1); border-top-left-radius: 25px; border-top-right-radius: 25px;
        }
        .nav-item { 
            background: none; border: none; color: var(--text-dim); display: flex; flex-direction: column; 
            align-items: center; gap: 6px; font-size: 11px; font-weight: 500; flex: 1; cursor: pointer; transition: 0.3s; 
        }
        .nav-item.active { color: var(--primary); }
        .nav-item.active-frosty { color: var(--secondary); }
        .nav-item .material-icons-round { font-size: 26px; transition: 0.3s; }
        .nav-item.active .material-icons-round, .nav-item.active-frosty .material-icons-round { transform: translateY(-4px); }

        /* Popup Leaflet Otimizado */
        .leaflet-popup-content-wrapper { background: rgba(20,20,25,0.9); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
        .leaflet-popup-tip { background: rgba(20,20,25,0.9); }
    </style>
</head>
<body>

<div id="app">
    <!-- Header Glass -->
    <div class="header glass">
        <div class="title-row">
            <h1>Ceará a Dois</h1>
            <span class="stats" id="stats">0 / 500</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>

    <!-- MAPA -->
    <div id="tab-map" class="tab-content active">
        <div class="map-wrapper">
            <div class="filters">
                <button class="filter-btn active" onclick="app.filterMap('all')">🌍 Todos</button>
                <button class="filter-btn" onclick="app.filterMap('praia')">🌊 Praias</button>
                <button class="filter-btn" onclick="app.filterMap('cultura')">🏛️ Cultura</button>
                <button class="filter-btn frosty" onclick="app.filterMap('frosty')">🍦 Frosty VIP</button>
            </div>
            <!-- Mapa renderizado via Canvas = Zero Lentidão -->
            <div id="map" class="glass"></div>
            <button class="fab" onclick="app.locate()"><span class="material-icons-round">gps_fixed</span></button>
        </div>
    </div>

    <!-- LISTA (Com limitação de render para não travar scroll) -->
    <div id="tab-list" class="tab-content">
        <div class="list-container" id="grid-list"></div>
    </div>

    <!-- FROSTY -->
    <div id="tab-frosty" class="tab-content">
        <div class="list-container" id="grid-frosty"></div>
    </div>

    <!-- NAV BOTTOM -->
    <div class="bottom-nav glass">
        <button class="nav-item active" onclick="app.switchTab('tab-map', this, 'primary')">
            <span class="material-icons-round">explore</span>Mapa
        </button>
        <button class="nav-item" onclick="app.switchTab('tab-list', this, 'primary')">
            <span class="material-icons-round">view_carousel</span>Descobrir
        </button>
        <button class="nav-item" onclick="app.switchTab('tab-frosty', this, 'secondary')">
            <span class="material-icons-round">icecream</span>Frosty VIP
        </button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// --- BANCO DE DADOS 500 ---
const DB = [];
let nextId = 1;

function addP(name, cat, lat, lng, desc) { DB.push({ id: nextId++, name, cat, lat, lng, desc }); }

// Unidades Frosty
const frostys = [ [-3.7250, -38.4975], [-3.7360, -38.5000], [-3.7385, -38.5375], [-3.8290, -38.4950], [-3.7750, -38.5620], [-3.7251, -38.5201], [-3.7431, -38.4751], [-3.8897, -38.4502], [-3.8760, -38.6250], [-3.6894, -40.3497], [-7.2307, -39.3130] ];
frostys.forEach((c, i) => { addP(`Frosty #${i+1}`, 'frosty', c[0], c[1], "Sobremesa a dois perfeita."); addP(`Frosty Express #${i+1}`, 'frosty', c[0]+0.01, c[1]-0.01, "Sorvete rápido."); });

// Locais Reais
const reais = [ {n: "Beira Mar", l: [-3.7255, -38.4950], c:"cultura"}, {n: "Parque do Cocó", l: [-3.7483, -38.4844], c:"cultura"}, {n: "Jericoacoara", l: [-2.7975, -40.5141], c:"praia"}, {n: "Canoa Quebrada", l: [-4.5269, -37.6974], c:"praia"} ];
reais.forEach(r => addP(r.n, r.c, r.l[0], r.l[1], "Local imperdível no Ceará."));

// Preenchimento Leve
for(let i=DB.length; i < 500; i++) {
    let cat = Math.random() > 0.5 ? 'praia' : 'cultura';
    addP(`Ponto Turístico #${i}`, cat, -3.7 - (Math.random()*3), -38.4 - (Math.random()*3), "Passeio romântico.");
}

// --- APP CORE ---
const app = {
    visited: new Set(JSON.parse(localStorage.getItem('ceara_liquid')) || []),
    map: null,
    pointsLayer: null, // Camada de pontos leves

    init() {
        this.updateStats();
        // Atraso intencional mínimo para garantir que a UI carregou antes do mapa pesado
        setTimeout(() => {
            this.initMap();
            this.renderCards();
        }, 300);
    },

    initMap() {
        // A MÁGICA DE PERFORMANCE: preferCanvas: true
        // Instrui o celular a usar a GPU para desenhar os pontos em vez de HTML elements
        this.map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([-3.75, -38.5], 11);
        
        // CartoDB Dark Matter - Gratuito, Sem chaves, Combina com Liquid Glass perfeitamente
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 18, attribution: '© CartoDB'
        }).addTo(this.map);

        this.pointsLayer = L.layerGroup().addTo(this.map);
        this.plot('all');
    },

    plot(filter) {
        this.pointsLayer.clearLayers();
        
        DB.forEach(p => {
            if(filter === 'all' || p.cat === filter) {
                let isF = p.cat === 'frosty';
                let isV = this.visited.has(p.id);
                
                // Cores hex alinhadas com as variáveis CSS
                let color = isF ? '#00f5d4' : '#9d4edd'; 
                if(isV) color = '#ffd700';

                // L.circleMarker é ultra rápido no modo Canvas, ideal para centenas de pontos mobile
                let m = L.circleMarker([p.lat, p.lng], {
                    radius: 7, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9
                });
                
                m.bindPopup(`<b style="color:${color}">${p.name}</b>`);
                this.pointsLayer.addLayer(m);
            }
        });
    },

    filterMap(cat) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        this.plot(cat);
    },

    // Renderização Limitada para o Scroll não travar
    renderCards() {
        const l = document.getElementById('grid-list');
        const f = document.getElementById('grid-frosty');
        
        let htmlL = '', htmlF = '';
        let countL = 0, countF = 0;

        DB.forEach(p => {
            let isF = p.cat === 'frosty';
            // Renderiza apenas os 50 primeiros de cada pra manter a UI ultra fluida
            if(isF && countF > 50) return;
            if(!isF && countL > 50) return;

            let isV = this.visited.has(p.id);
            let html = `
                <div class="card ${isF ? 'frosty-card' : ''}">
                    <div class="card-header">
                        <div>
                            <div class="card-cat">${p.cat}</div>
                            <h3 class="card-title">${p.name}</h3>
                        </div>
                        <button class="star-btn ${isV ? 'visited' : ''}" onclick="app.toggle(${p.id}, this)">
                            <span class="material-icons-round">${isV ? 'star' : 'star_border'}</span>
                        </button>
                    </div>
                    <p class="card-desc">${p.desc}</p>
                </div>`;
            
            if(isF) { htmlF += html; countF++; }
            else { htmlL += html; countL++; }
        });

        l.innerHTML = htmlL;
        f.innerHTML = htmlF;
    },

    toggle(id, btn) {
        if(this.visited.has(id)) {
            this.visited.delete(id);
            btn.classList.remove('visited');
            btn.querySelector('.material-icons-round').innerText = 'star_border';
        } else {
            this.visited.add(id);
            btn.classList.add('visited');
            btn.querySelector('.material-icons-round').innerText = 'star';
        }
        localStorage.setItem('ceara_liquid', JSON.stringify([...this.visited]));
        this.updateStats();
        
        let filter = document.querySelector('.filter-btn.active').innerText.toLowerCase();
        this.plot(filter.includes('frosty') ? 'frosty' : (filter.includes('praia') ? 'praia' : (filter.includes('cultura') ? 'cultura' : 'all')));
    },

    updateStats() {
        const v = this.visited.size;
        document.getElementById('stats').innerText = `${v} / 500`;
        document.getElementById('progress').style.width = `${(v/500)*100}%`;
    },

    switchTab(id, btn, color) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active', 'active-frosty'));
        btn.classList.add(color === 'secondary' ? 'active-frosty' : 'active');
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'tab-map') setTimeout(() => this.map.invalidateSize(), 50);
    },

    locate() {
        if("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
                this.map.flyTo([pos.coords.latitude, pos.coords.longitude], 13);
            });
        }
    }
};

window.onload = () => app.init();
</script>
</body>
</html>
