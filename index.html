<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ceará a Dois - Premium Experience</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #9d4edd; 
            --secondary: #00f5d4; 
            --wine: #ff477e; /* Nova cor para Cafés e Vinhos */
            --glass-bg: rgba(25, 25, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
            --gold: #ffd700;
        }

        @keyframes gradientFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        body, html { 
            margin: 0; padding: 0; height: 100%; font-family: 'Outfit', sans-serif; color: var(--text-main); overflow: hidden;
            background: linear-gradient(-45deg, #0d0a14, #1a0f2e, #0a1f1c, #140a12);
            background-size: 400% 400%; animation: gradientFlow 15s ease infinite;
        }
        
        #app { display: flex; flex-direction: column; height: 100vh; position: relative; }

        .glass { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }

        .header { padding: 15px 20px; z-index: 10; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; margin-bottom: 5px; }
        .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;}
        .title-row h1 { margin: 0; font-size: 20px; font-weight: 700; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stats { font-size: 13px; font-weight: 500; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 12px;}
        
        .progress-bar { width: 100%; height: 8px; background: rgba(0,0,0,0.4); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: 0.8s; }

        .tab-content { flex: 1; display: none; position: relative; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth;}
        .tab-content.active { display: block; animation: fadeUp 0.4s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #map { width: 100%; height: 100%; z-index: 1; border-radius: 20px; }
        .map-wrapper { padding: 0 10px; height: calc(100% - 10px); position: relative; }
        
        .filters { position: absolute; top: 15px; left: 20px; right: 20px; z-index: 1000; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { background: rgba(10, 10, 15, 0.8); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); padding: 10px 16px; border-radius: 25px; font-size: 12px; font-weight: 500; white-space: nowrap; transition: 0.3s; cursor: pointer; }
        .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff;}
        .filter-btn.frosty.active { background: var(--secondary); border-color: var(--secondary); color: #000; }
        .filter-btn.wine.active { background: var(--wine); border-color: var(--wine); color: #fff; }
        
        .fab { position: absolute; bottom: 85px; right: 25px; width: 55px; height: 55px; border-radius: 50%; color: var(--secondary); display: flex; justify-content: center; align-items: center; z-index: 1000; cursor: pointer; border: 1px solid var(--secondary);}
        .fab:active { transform: scale(0.9); }

        .list-container { padding: 10px 20px 100px; display: grid; gap: 15px; }
        .card { background: rgba(25, 25, 35, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); padding: 18px; border-radius: 20px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
        .card.frosty-card::before { background: var(--secondary); }
        .card.wine-card::before { background: var(--wine); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-title { font-size: 16px; font-weight: 700; margin: 0; }
        .card-cat { font-size: 10px; color: var(--primary); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px;}
        .frosty-card .card-cat { color: var(--secondary); }
        .wine-card .card-cat { color: var(--wine); }
        .card-desc { font-size: 13px; color: var(--text-dim); margin: 0; line-height: 1.4; }
        .poem-text { margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 12px; font-style: italic; color: #e0e0e0; border-left: 2px solid var(--gold); }
        
        .star-btn { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; color: var(--text-dim); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; }
        .star-btn.visited { color: var(--gold); background: rgba(255, 215, 0, 0.1); border-color: rgba(255, 215, 0, 0.3); }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; z-index: 2000; display: flex; justify-content: space-around; padding: 15px 0 25px; border-top: 1px solid rgba(255,255,255,0.1); border-top-left-radius: 25px; border-top-right-radius: 25px;}
        .nav-item { background: none; border: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active-frosty { color: var(--secondary); }
        .nav-item .material-icons-round { font-size: 26px; transition: 0.3s; }
        .nav-item.active .material-icons-round { transform: translateY(-4px); }

        /* Modal do Diário Poético */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(5px);}
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 20px; border-radius: 20px; width: 85%; max-width: 400px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .modal-box h2 { margin: 0 0 10px; font-size: 18px; color: var(--gold); }
        .modal-box textarea { width: 100%; height: 100px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; padding: 10px; font-family: 'Outfit'; font-size: 13px; outline: none; resize: none; box-sizing: border-box; margin-bottom: 15px;}
        .modal-box textarea:focus { border-color: var(--primary); }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-family: 'Outfit';}
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-save { background: var(--primary); color: white; }

        /* Estilização do Popup do Mapa */
        .leaflet-popup-content-wrapper { background: rgba(20,20,25,0.95); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px;}
        .leaflet-popup-tip { background: rgba(20,20,25,0.95); }
        .route-btn { display: block; width: 100%; padding: 8px; margin-top: 10px; background: var(--secondary); color: #000; text-align: center; border-radius: 8px; text-decoration: none; font-weight: bold; font-family: 'Outfit'; font-size: 12px;}
    </style>
</head>
<body>

<div id="app">
    <div class="header glass">
        <div class="title-row">
            <h1>Ceará a Dois</h1>
            <span class="stats" id="stats">0 / 500</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>

    <!-- MAPA -->
    <div id="tab-map" class="tab-content active">
        <div class="map-wrapper">
            <div class="filters">
                <button class="filter-btn active" onclick="app.filterMap('all')">🌍 Todos</button>
                <button class="filter-btn" onclick="app.filterMap('praia')">🌊 Praias</button>
                <button class="filter-btn" onclick="app.filterMap('cultura')">🏛️ Cultura</button>
                <button class="filter-btn wine" onclick="app.filterMap('vinho')">🍷 Cafés & Vinhos</button>
                <button class="filter-btn frosty" onclick="app.filterMap('frosty')">🍦 Frosty VIP</button>
            </div>
            <div id="map" class="glass"></div>
            <button class="fab glass" onclick="app.locate()"><span class="material-icons-round">gps_fixed</span></button>
        </div>
    </div>

    <!-- LISTA -->
    <div id="tab-list" class="tab-content">
        <div class="list-container" id="grid-list"></div>
    </div>

    <!-- FROSTY -->
    <div id="tab-frosty" class="tab-content">
        <div class="list-container" id="grid-frosty"></div>
    </div>

    <!-- NAV BOTTOM -->
    <div class="bottom-nav glass">
        <button class="nav-item active" onclick="app.switchTab('tab-map', this, 'primary')">
            <span class="material-icons-round">explore</span>Mapa
        </button>
        <button class="nav-item" onclick="app.switchTab('tab-list', this, 'primary')">
            <span class="material-icons-round">book</span>Diário
        </button>
        <button class="nav-item" onclick="app.switchTab('tab-frosty', this, 'secondary')">
            <span class="material-icons-round">icecream</span>Frosty VIP
        </button>
    </div>
</div>

<!-- Modal Poético -->
<div class="modal-overlay" id="poemModal">
    <div class="modal-box">
        <h2>Guardar Memória ✨</h2>
        <p style="font-size: 12px; color: var(--text-dim); margin-top:0;">Escreva um pequeno texto, sentimento ou poesia sobre esse local.</p>
        <textarea id="poemInput" placeholder="A saudade é a memória do coração..."></textarea>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="app.closeModal()">Agora Não</button>
            <button class="btn-save" onclick="app.savePoem()">Guardar</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DB = [];
let nextId = 1;

function addP(name, cat, lat, lng, desc) { DB.push({ id: nextId++, name, cat, lat, lng, desc }); }

// 1. Unidades Frosty
const frostys = [ [-3.7250, -38.4975], [-3.7360, -38.5000], [-3.7385, -38.5375], [-3.8290, -38.4950], [-3.7750, -38.5620], [-3.7251, -38.5201], [-3.7431, -38.4751], [-3.8897, -38.4502] ];
frostys.forEach((c, i) => { addP(`Frosty #${i+1}`, 'frosty', c[0], c[1], "Sobremesa a dois perfeita."); addP(`Frosty Express #${i+1}`, 'frosty', c[0]+0.01, c[1]-0.01, "Sorvete rápido."); });

// 2. Cafés & Vinhos (Nova Categoria)
const vinhos = [
    {n: "Santa Clara Eco Café", l: [-3.7315, -38.5020]}, {n: "Grand Cru Vinhos", l: [-3.7380, -38.4950]},
    {n: "Brava Wine", l: [-3.7405, -38.4900]}, {n: "Café Viriato", l: [-3.7365, -38.4910]},
    {n: "Empório do Vinho Cariri", l: [-7.2340, -39.3130]}
];
vinhos.forEach(v => addP(v.n, 'vinho', v.l[0], v.l[1], "Perfeito para degustar vinhos e queijos a dois."));

// 3. Turismo Geral
const reais = [ {n: "Beira Mar", l: [-3.7255, -38.4950], c:"cultura"}, {n: "Parque do Cocó", l: [-3.7483, -38.4844], c:"cultura"}, {n: "Dragão do Mar", l: [-3.7214, -38.5117], c:"cultura"} ];
reais.forEach(r => addP(r.n, r.c, r.l[0], r.l[1], "Local imperdível no Ceará."));

for(let i=DB.length; i < 500; i++) {
    let cat = Math.random() > 0.5 ? 'praia' : 'cultura';
    addP(`Ponto Turístico #${i}`, cat, -3.7 - (Math.random()*3), -38.4 - (Math.random()*3), "Passeio e roteiro romântico.");
}

const app = {
    visited: new Set(JSON.parse(localStorage.getItem('ceara_liquid_v5')) || []),
    poems: JSON.parse(localStorage.getItem('ceara_poems_v5')) || {},
    map: null, pointsLayer: null, activePlaceId: null,

    init() {
        this.updateStats();
        setTimeout(() => { this.initMap(); this.renderCards(); }, 300);
    },

    initMap() {
        this.map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([-3.75, -38.5], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(this.map);
        this.pointsLayer = L.layerGroup().addTo(this.map);
        this.plot('all');
    },

    plot(filter) {
        this.pointsLayer.clearLayers();
        DB.forEach(p => {
            if(filter === 'all' || p.cat === filter) {
                let isF = p.cat === 'frosty';
                let isW = p.cat === 'vinho';
                let isV = this.visited.has(p.id);
                
                let color = isF ? '#00f5d4' : (isW ? '#ff477e' : '#9d4edd'); 
                if(isV) color = '#ffd700';

                let m = L.circleMarker([p.lat, p.lng], { radius: 7, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9 });
                
                // POPUP MÁGICO COM TRAÇAR ROTA
                let routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
                m.bindPopup(`
                    <b style="color:${color}; font-size:14px;">${p.name}</b><br>
                    <span style="font-size:11px; color:#bbb;">${p.desc}</span>
                    <a href="${routeUrl}" target="_blank" class="route-btn">🗺️ Traçar Rota GPS</a>
                `);
                this.pointsLayer.addLayer(m);
            }
        });
    },

    filterMap(cat) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        this.plot(cat);
    },

    renderCards() {
        const l = document.getElementById('grid-list');
        const f = document.getElementById('grid-frosty');
        let htmlL = '', htmlF = ''; let countL = 0, countF = 0;

        // Ordena para mostrar os visitados com poema no topo
        const sortedDB = [...DB].sort((a,b) => this.visited.has(b.id) - this.visited.has(a.id));

        sortedDB.forEach(p => {
            let isF = p.cat === 'frosty';
            let isW = p.cat === 'vinho';
            if(isF && countF > 80) return;
            if(!isF && countL > 80) return;

            let isV = this.visited.has(p.id);
            let poem = this.poems[p.id];
            let cardClass = isF ? 'frosty-card' : (isW ? 'wine-card' : '');

            let html = `
                <div class="card ${cardClass}">
                    <div class="card-header">
                        <div>
                            <div class="card-cat">${p.cat}</div>
                            <h3 class="card-title">${p.name}</h3>
                        </div>
                        <button class="star-btn ${isV ? 'visited' : ''}" onclick="app.handleStarClick(${p.id}, this)">
                            <span class="material-icons-round">${isV ? 'star' : 'star_border'}</span>
                        </button>
                    </div>
                    <p class="card-desc">${p.desc}</p>
                    ${poem ? `<div class="poem-text">"${poem}"</div>` : ''}
                </div>`;
            
            if(isF) { htmlF += html; countF++; } else { htmlL += html; countL++; }
        });
        l.innerHTML = htmlL; f.innerHTML = htmlF;
    },

    handleStarClick(id, btn) {
        if(this.visited.has(id)) {
            // Desmarcar
            this.visited.delete(id);
            delete this.poems[id];
            this.saveData();
            this.renderCards();
            this.plotCurrentFilter();
        } else {
            // Marcar (Abre o modal poético)
            this.activePlaceId = id;
            document.getElementById('poemInput').value = '';
            document.getElementById('poemModal').classList.add('active');
        }
    },

    closeModal() {
        document.getElementById('poemModal').classList.remove('active');
        // Marca como visitado mesmo sem poema
        if(this.activePlaceId) {
            this.visited.add(this.activePlaceId);
            this.saveData();
            this.renderCards();
            this.plotCurrentFilter();
            this.activePlaceId = null;
        }
    },

    savePoem() {
        let text = document.getElementById('poemInput').value;
        if(text.trim() !== '') {
            this.poems[this.activePlaceId] = text;
        }
        this.closeModal();
    },

    saveData() {
        localStorage.setItem('ceara_liquid_v5', JSON.stringify([...this.visited]));
        localStorage.setItem('ceara_poems_v5', JSON.stringify(this.poems));
        this.updateStats();
    },

    plotCurrentFilter() {
        let filter = document.querySelector('.filter-btn.active').innerText.toLowerCase();
        let cat = filter.includes('frosty') ? 'frosty' : (filter.includes('vinho') ? 'vinho' : (filter.includes('praia') ? 'praia' : (filter.includes('cultura') ? 'cultura' : 'all')));
        this.plot(cat);
    },

    updateStats() {
        const v = this.visited.size;
        document.getElementById('stats').innerText = `${v} / 500`;
        document.getElementById('progress').style.width = `${(v/500)*100}%`;
    },

    switchTab(id, btn, color) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active', 'active-frosty'));
        btn.classList.add(color === 'secondary' ? 'active-frosty' : 'active');
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'tab-map') setTimeout(() => this.map.invalidateSize(), 50);
    },

    locate() {
        if("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
                this.map.flyTo([pos.coords.latitude, pos.coords.longitude], 14);
            });
        }
    }
};

window.onload = () => app.init();
</script>
</body>
</html>
